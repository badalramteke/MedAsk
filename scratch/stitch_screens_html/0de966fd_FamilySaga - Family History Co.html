<script>
        // Simple script to update the selected conditions count
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('.custom-checkbox');
            const summaryChip = document.querySelector('.bg-secondary-container');
            
            checkboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const checkedCount = document.querySelectorAll('.custom-checkbox:checked').length;
                    if(summaryChip) {
                        summaryChip.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Selected: ${checkedCount} conditions`;
                    }
                });
            });
        });

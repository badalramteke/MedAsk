<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediKiosk - New Patient Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary": "#ffffff",
                    "outline-variant": "#bdc9c5",
                    "tertiary-fixed": "#ffdad6",
                    "surface": "#f8fafa",
                    "outline": "#6e7976",
                    "background": "#f8fafa",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed": "#410003",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f8fafa",
                    "on-background": "#191c1d",
                    "surface-tint": "#006b5d",
                    "secondary": "#006e1c",
                    "on-surface": "#191c1d",
                    "on-tertiary-container": "#ffeae8",
                    "surface-container": "#eceeee",
                    "inverse-primary": "#7dd6c4",
                    "inverse-on-surface": "#eff1f1",
                    "primary-fixed": "#99f3e0",
                    "primary-container": "#0f7a6b",
                    "secondary-fixed-dim": "#78dc77",
                    "on-secondary-fixed-variant": "#005313",
                    "surface-variant": "#e1e3e3",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed-dim": "#ffb3ac",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed-variant": "#930010",
                    "on-primary-fixed-variant": "#005046",
                    "secondary-container": "#91f78e",
                    "on-secondary-fixed": "#002204",
                    "on-primary-container": "#abffed",
                    "inverse-surface": "#2e3131",
                    "primary": "#005f53",
                    "on-secondary-container": "#00731e",
                    "surface-container-highest": "#e1e3e3",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#e6e8e9",
                    "on-surface-variant": "#3e4946",
                    "surface-container-low": "#f2f4f4",
                    "primary-fixed-dim": "#7dd6c4",
                    "tertiary": "#aa0a17",
                    "tertiary-container": "#ce2b2c",
                    "secondary-fixed": "#94f990",
                    "surface-dim": "#d8dada",
                    "on-primary-fixed": "#00201b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-edge": "32px",
                    "stack-gap": "16px",
                    "section-gap": "48px",
                    "gutter-md": "24px",
                    "touch-target-min": "64px"
            },
            "fontFamily": {
                    "label-lg": ["Inter"],
                    "display-lg-mobile": ["Inter"],
                    "headline-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "button-text": ["Inter"],
                    "body-md": ["Noto Sans"],
                    "headline-lg": ["Inter"],
                    "body-lg": ["Noto Sans"]
            },
            "fontSize": {
                    "label-lg": ["18px", {"lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "display-lg-mobile": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "60px", "fontWeight": "700"}],
                    "button-text": ["20px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-md": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "44px", "fontWeight": "600"}],
                    "body-lg": ["20px", {"lineHeight": "32px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid theme('colors.outline-variant');
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        .form-input-tall {
            min-height: 72px;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-container docked full-width top-0 bg-surface-container-low dark:bg-surface-container shadow-sm flex justify-between items-center w-full px-margin-edge py-4 z-50 relative">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed-dim">MediKiosk</h1>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 bg-error-container text-on-error-container rounded-full px-6 h-touch-target-min font-button-text text-button-text hover:bg-opacity-90 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emergency</span>
                Emergency
            </button>
<div class="flex gap-2">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim text-3xl">location_on</span>
</button>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim text-3xl">schedule</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-4xl mx-auto mt-section-gap px-margin-edge">
<!-- Stepper -->
<div class="mb-stack-gap text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-4">Step 1 of 5: Basic Details</h2>
<div class="flex gap-2 w-full max-w-md mx-auto h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="w-1/5 bg-primary h-full rounded-full"></div>
<div class="w-1/5 bg-surface-variant h-full"></div>
<div class="w-1/5 bg-surface-variant h-full"></div>
<div class="w-1/5 bg-surface-variant h-full"></div>
<div class="w-1/5 bg-surface-variant h-full"></div>
</div>
</div>
<!-- Registration Form Card -->
<div class="glass-card rounded-[24px] p-8 space-y-stack-gap">
<!-- Full Name -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2" for="fullName">Full Name</label>
<input class="w-full form-input-tall bg-surface-container-lowest border border-outline-variant rounded-[24px] px-6 font-body-lg text-body-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="fullName" placeholder="Enter full name" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<!-- Date of Birth -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2" for="dob">Date of Birth</label>
<div class="relative">
<input class="w-full form-input-tall bg-surface-container-lowest border border-outline-variant rounded-[24px] px-6 pl-14 font-body-lg text-body-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="dob" type="date"/>
<span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-on-surface-variant text-2xl">calendar_today</span>
</div>
</div>
<!-- Gender -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Gender</label>
<div class="flex gap-2 h-[72px]">
<button class="flex-1 flex items-center justify-center gap-2 bg-primary-container text-on-primary-container rounded-[24px] font-label-lg text-label-lg hover:opacity-90 active:scale-[0.98] transition-all border-2 border-transparent">
<span class="material-symbols-outlined">male</span>
                            Male
                        </button>
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-container-lowest text-on-surface border border-outline-variant rounded-[24px] font-label-lg text-label-lg hover:bg-surface-variant active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">female</span>
                            Female
                        </button>
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-container-lowest text-on-surface border border-outline-variant rounded-[24px] font-label-lg text-label-lg hover:bg-surface-variant active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">transgender</span>
                            Other
                        </button>
</div>
</div>
</div>
<!-- Mobile Number -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2" for="mobile">Mobile Number</label>
<div class="flex">
<span class="inline-flex items-center px-6 bg-surface-variant border border-r-0 border-outline-variant rounded-l-[24px] font-body-lg text-body-lg text-on-surface-variant">
                        +91
                    </span>
<input class="w-full form-input-tall bg-surface-container-lowest border border-outline-variant rounded-r-[24px] px-6 font-body-lg text-body-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="mobile" placeholder="Enter 10-digit number" type="tel"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<!-- State -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2" for="state">State</label>
<div class="relative">
<select class="w-full form-input-tall bg-surface-container-lowest border border-outline-variant rounded-[24px] px-6 appearance-none font-body-lg text-body-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="state">
<option value="">Select State</option>
<option value="mh">Maharashtra</option>
<option value="ka">Karnataka</option>
</select>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- City -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2" for="city">City</label>
<div class="relative">
<select class="w-full form-input-tall bg-surface-container-lowest border border-outline-variant rounded-[24px] px-6 appearance-none font-body-lg text-body-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="city">
<option value="">Select City</option>
<option value="mum">Mumbai</option>
<option value="blr">Bangalore</option>
</select>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Optional Aadhaar -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2 flex items-center gap-2" for="aadhaar">
                    Aadhaar (Last 4 digits) 
                    <span class="text-sm font-normal text-outline bg-surface-container-highest px-2 py-1 rounded-full">Optional</span>
</label>
<input class="w-full md:w-1/3 form-input-tall bg-surface-container-lowest border border-outline-variant rounded-[24px] px-6 font-body-lg text-body-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-center tracking-widest" id="aadhaar" maxlength="4" placeholder="XXXX" type="text"/>
</div>
<!-- ABHA Consent -->
<div class="pt-4 border-t border-outline-variant">
<label class="flex items-start gap-4 cursor-pointer group">
<div class="relative flex items-center">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-8 h-8 rounded-lg border-2 border-outline-variant peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-white text-xl opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div>
<span class="font-label-lg text-label-lg text-on-surface block">Create ABHA ID using these details</span>
<span class="text-sm text-on-surface-variant mt-1 block">Ayushman Bharat Health Account enables seamless health record tracking.</span>
</div>
</label>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full z-50 flex justify-between items-center px-margin-edge py-6 h-[100px] bg-white dark:bg-surface-container-high border-t border-outline-variant shadow-[0_-4px_10px_0_rgba(0,0,0,0.05)] rounded-t-xl">
<button class="border-2 border-primary text-primary rounded-lg px-8 py-4 font-button-text text-button-text hover:opacity-90 active:scale-[0.98] transition-transform min-w-[160px]">
            Back
        </button>
<button class="bg-primary-container text-on-primary-container rounded-lg px-8 py-4 font-button-text text-button-text hover:opacity-90 active:scale-[0.98] transition-transform min-w-[160px] flex items-center justify-center gap-2">
            Continue
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
</body></html>

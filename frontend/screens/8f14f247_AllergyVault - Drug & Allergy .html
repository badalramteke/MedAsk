<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediKiosk - AllergyVault</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#d8dada",
                        "tertiary-container": "#ce2b2c",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#3e4946",
                        "tertiary-fixed-dim": "#ffb3ac",
                        "primary-fixed-dim": "#7dd6c4",
                        "surface": "#f8fafa",
                        "on-error": "#ffffff",
                        "on-primary-container": "#abffed",
                        "background": "#f8fafa",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#00201b",
                        "on-tertiary-fixed": "#410003",
                        "primary": "#005f53",
                        "on-primary-fixed-variant": "#005046",
                        "on-primary": "#ffffff",
                        "tertiary": "#aa0a17",
                        "on-tertiary-fixed-variant": "#930010",
                        "tertiary-fixed": "#ffdad6",
                        "primary-fixed": "#99f3e0",
                        "primary-container": "#0f7a6b",
                        "inverse-primary": "#7dd6c4",
                        "surface-tint": "#006b5d",
                        "surface-container-highest": "#e1e3e3",
                        "outline": "#6e7976",
                        "secondary-fixed-dim": "#78dc77",
                        "on-surface": "#191c1d",
                        "on-secondary-container": "#00731e",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2e3131",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f2f4f4",
                        "inverse-on-surface": "#eff1f1",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#94f990",
                        "surface-variant": "#e1e3e3",
                        "surface-container-high": "#e6e8e9",
                        "outline-variant": "#bdc9c5",
                        "surface-bright": "#f8fafa",
                        "surface-container": "#eceeee",
                        "on-secondary-fixed-variant": "#005313",
                        "secondary": "#006e1c",
                        "on-background": "#191c1d",
                        "secondary-container": "#91f78e",
                        "on-tertiary-container": "#ffeae8",
                        "on-secondary-fixed": "#002204"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "48px",
                        "margin-edge": "32px",
                        "stack-gap": "16px",
                        "gutter-md": "24px",
                        "touch-target-min": "64px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "button-text": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-lg": ["Noto Sans"],
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Noto Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "44px", "fontWeight": "600" }],
                        "button-text": ["20px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-lg": ["20px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "60px", "fontWeight": "700" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col pt-24 pb-[100px]">
<!-- TopAppBar -->
<header class="fixed bg-surface shadow-sm flex justify-between items-center w-full px-margin-edge h-touch-target-min docked full-width top-0 z-50">
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md text-primary font-bold">MediKiosk</span>
<span class="font-body-md text-body-md text-on-surface-variant border-l-2 border-outline-variant pl-4 ml-4">Step 2 of 5</span>
</div>
<div class="flex items-center gap-4">
<button class="bg-error-container text-on-error-container font-label-lg text-label-lg px-6 py-2 rounded-xl flex items-center gap-2 hover:bg-tertiary-container hover:text-on-tertiary transition-colors min-h-[64px]">
<span class="material-symbols-outlined" data-icon="emergency">emergency</span>
                Emergency SOS
            </button>
</div>
</header>
<main class="flex-grow w-full max-w-7xl mx-auto px-margin-edge py-section-gap flex flex-col gap-section-gap">
<!-- Header Section -->
<div class="flex flex-col gap-4 text-center items-center">
<h1 class="font-display-lg text-display-lg text-on-surface">Any known allergies or medications?</h1>
<label class="flex items-center gap-4 p-6 bg-surface-container rounded-xl cursor-pointer hover:bg-surface-container-high transition-colors shadow-sm mt-8 w-full max-w-2xl border-2 border-transparent focus-within:border-primary">
<input class="w-8 h-8 text-primary border-outline rounded focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="checkbox"/>
<span class="font-headline-md text-headline-md text-on-surface select-none">I have no known allergies or current medications</span>
</label>
</div>
<!-- Bento Grid for Medications & Allergies -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-gutter-md">
<!-- Medications Section -->
<section class="bg-surface rounded-xl p-6 shadow-sm border border-outline-variant flex flex-col gap-6 h-full relative overflow-hidden group">
<div class="absolute inset-0 bg-primary-fixed opacity-5 pointer-events-none transition-opacity group-hover:opacity-10"></div>
<header class="flex justify-between items-center z-10">
<h2 class="font-headline-lg text-headline-lg text-on-surface flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="pill">pill</span>
                        Current Medications
                    </h2>
<button class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-sm hover:brightness-95 transition-all focus:ring-4 focus:ring-primary-fixed">
<span class="material-symbols-outlined text-3xl" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</header>
<div class="flex flex-col gap-4 z-10 flex-grow">
<!-- Medication Chip 1 -->
<div class="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant flex justify-between items-center shadow-sm">
<div>
<p class="font-label-lg text-label-lg text-on-surface">Metformin</p>
<p class="font-body-md text-body-md text-on-surface-variant">500mg, Twice daily</p>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Medication Chip 2 -->
<div class="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant flex justify-between items-center shadow-sm">
<div>
<p class="font-label-lg text-label-lg text-on-surface">Amlodipine</p>
<p class="font-body-md text-body-md text-on-surface-variant">5mg, Once daily</p>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
<button class="w-full min-h-[64px] border-2 border-primary text-primary font-button-text text-button-text rounded-xl flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors z-10 mt-auto">
<span class="material-symbols-outlined" data-icon="add">add</span>
                    Add Medication
                </button>
</section>
<!-- Allergies Section -->
<section class="bg-surface rounded-xl p-6 shadow-sm border-2 border-tertiary-container flex flex-col gap-6 h-full relative overflow-hidden group">
<div class="absolute inset-0 bg-error-container opacity-5 pointer-events-none transition-opacity group-hover:opacity-10"></div>
<header class="flex justify-between items-center z-10">
<h2 class="font-headline-lg text-headline-lg text-on-surface flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary-container text-4xl" data-icon="warning">warning</span>
                        Allergies
                    </h2>
<button class="w-16 h-16 rounded-full bg-error-container text-on-error-container flex items-center justify-center shadow-sm hover:brightness-95 transition-all focus:ring-4 focus:ring-tertiary-fixed">
<span class="material-symbols-outlined text-3xl" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</header>
<div class="flex flex-col gap-4 z-10 flex-grow">
<!-- Allergy Chip 1 -->
<div class="bg-error-container text-on-error-container p-4 rounded-xl flex justify-between items-center shadow-sm">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined" data-icon="medication" data-weight="fill" style="font-variation-settings: 'FILL' 1;">medication</span>
<div>
<p class="font-label-lg text-label-lg font-bold">Penicillin</p>
<p class="font-body-md text-body-md opacity-90">Drug • Severe Reaction</p>
</div>
</div>
<button class="text-on-error-container hover:text-error transition-colors p-2 bg-surface bg-opacity-20 rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
<button class="w-full min-h-[64px] border-2 border-tertiary-container text-tertiary-container font-button-text text-button-text rounded-xl flex items-center justify-center gap-2 hover:bg-error-container hover:text-on-error-container transition-colors z-10 mt-auto">
<span class="material-symbols-outlined" data-icon="add">add</span>
                    Add Allergy
                </button>
</section>
</div>
</main>
<!-- BottomNavBar -->
<footer class="bg-surface-container-low border-t-2 border-outline-variant shadow-lg fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-edge py-4 h-[100px]">
<button class="flex flex-row items-center justify-center border-2 border-primary text-primary rounded-xl px-8 py-4 min-h-[64px] font-button-text text-button-text hover:brightness-95 transition-all gap-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            Back
        </button>
<button class="flex flex-row items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-8 py-4 min-h-[64px] font-button-text text-button-text hover:brightness-95 transition-all gap-2 Active: transform scale-98 shadow-inner">
            Continue
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</body></html>

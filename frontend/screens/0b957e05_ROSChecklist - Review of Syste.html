<script>
        function toggleCard(card) {
            const isExpanded = card.getAttribute('aria-expanded') === 'true';
            
            // Close all other cards (accordion style, optional but cleaner for UI)
            document.querySelectorAll('.symptom-card').forEach(c => {
                c.setAttribute('aria-expanded', 'false');
                c.querySelector('.card-chevron').style.transform = 'rotate(0deg)';
            });

            // Toggle clicked card
            if (!isExpanded) {
                card.setAttribute('aria-expanded', 'true');
                card.querySelector('.card-chevron').style.transform = 'rotate(180deg)';
            }
        }
        
        // Handle "None of the above" logic
        document.getElementById('none-above').addEventListener('change', function(e) {
            if(e.target.checked) {
                document.querySelectorAll('.symptoms-content input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                });
            }
        });
        
        // Uncheck "None of the above" if any symptom is selected
        document.querySelectorAll('.symptoms-content input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', function() {
                if(this.checked) {
                    document.getElementById('none-above').checked = false;
                }
            })
        });
    </script>

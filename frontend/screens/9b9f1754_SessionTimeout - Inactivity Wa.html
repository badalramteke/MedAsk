<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Are you still there?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto mb-10">
                Your session will expire in 60 seconds to protect your privacy.
            </p>
<!-- Circular Timer -->
<div class="relative w-48 h-48 mb-10 flex items-center justify-center">
<svg class="w-full h-full circular-progress absolute inset-0" viewbox="0 0 160 160">
<circle class="stroke-surface-container-high" cx="80" cy="80" fill="none" r="70" stroke-width="12"></circle>
<circle class="stroke-primary" cx="80" cy="80" fill="none" id="progress-ring" r="70" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<span class="font-display-lg text-display-lg text-primary" id="countdown-text">60</span>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-gutter-md w-full mb-6">
<button class="flex-1 h-touch-target-min bg-primary text-on-primary rounded-xl font-button-text text-button-text hover:bg-primary/90 transition-colors active:scale-[0.98] flex items-center justify-center">
                    Yes, continue
                </button>
<button class="flex-1 h-touch-target-min bg-transparent border-2 border-primary text-primary rounded-xl font-button-text text-button-text hover:bg-primary/5 transition-colors active:scale-[0.98] flex items-center justify-center">
                    No, end session
                </button>
</div>
<!-- Warning Text -->
<p class="font-body-md text-body-md text-on-surface-variant flex items-start gap-2 text-left bg-surface-container-low p-4 rounded-lg w-full">
<span class="material-symbols-outlined text-outline mt-1">info</span>
<span>Your information has NOT been saved yet. If session ends, you will need to start over.</span>
</p>
</div>
</div>
<script>
        // Simple countdown logic for visual demonstration
        let timeLeft = 60;
        const countdownText = document.getElementById('countdown-text');
        const progressRing = document.getElementById('progress-ring');
        const circumference = 2 * Math.PI * 70; // r=70

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                countdownText.textContent = timeLeft;
                // Calculate percentage
                const percentage = timeLeft / 60;
                // Update dashoffset
                const offset = circumference - (percentage * circumference);
                progressRing.style.strokeDashoffset = offset;
            } else {
                clearInterval(timer);
                // Handle timeout action here
            }
        }, 1000);
    </script>

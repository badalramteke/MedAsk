<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>MediKiosk - Clinical Assessment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans:wght@400;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#94f990",
                        "on-primary": "#ffffff",
                        "surface-bright": "#f8fafa",
                        "surface-tint": "#006b5d",
                        "on-primary-fixed": "#00201b",
                        "background": "#f8fafa",
                        "surface-container": "#eceeee",
                        "on-secondary-container": "#00731e",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#7dd6c4",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#002204",
                        "primary": "#005f53",
                        "on-tertiary-fixed": "#410003",
                        "tertiary": "#aa0a17",
                        "tertiary-fixed": "#ffdad6",
                        "secondary": "#006e1c",
                        "primary-container": "#0f7a6b",
                        "on-error": "#ffffff",
                        "outline": "#6e7976",
                        "tertiary-container": "#ce2b2c",
                        "surface-container-high": "#e6e8e9",
                        "primary-fixed-dim": "#7dd6c4",
                        "on-tertiary-fixed-variant": "#930010",
                        "on-surface": "#191c1d",
                        "surface-container-highest": "#e1e3e3",
                        "surface": "#f8fafa",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eff1f1",
                        "on-primary-fixed-variant": "#005046",
                        "tertiary-fixed-dim": "#ffb3ac",
                        "secondary-container": "#91f78e",
                        "primary-fixed": "#99f3e0",
                        "outline-variant": "#bdc9c5",
                        "on-surface-variant": "#3e4946",
                        "on-secondary-fixed-variant": "#005313",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#ffeae8",
                        "on-primary-container": "#abffed",
                        "surface-container-low": "#f2f4f4",
                        "on-background": "#191c1d",
                        "surface-variant": "#e1e3e3",
                        "surface-dim": "#d8dada",
                        "secondary-fixed-dim": "#78dc77",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2e3131"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "64px",
                        "section-gap": "48px",
                        "margin-edge": "32px",
                        "gutter-md": "24px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "button-text": ["Inter"],
                        "body-md": ["Noto Sans"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Noto Sans"]
                    },
                    "fontSize": {
                        "label-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "60px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "44px", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "button-text": ["20px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["20px", { "lineHeight": "32px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .waveform-bar {
            animation: pulse-height 1s infinite alternate;
        }
        @keyframes pulse-height {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Header & Progress Stepper -->
<header class="flex flex-col bg-surface-container-lowest shadow-sm z-10 sticky top-0 w-full">
<!-- TopAppBar (from JSON) -->
<div class="flex justify-between items-center h-[100px] px-margin-edge w-full">
<div class="flex items-center gap-4">
<div class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed-dim">MediKiosk</div>
<div class="font-label-lg text-label-lg text-on-surface-variant dark:text-outline-variant hidden md:block">at City General Hospital</div>
</div>
<div class="flex items-center gap-6">
<div class="font-label-lg text-label-lg text-on-surface-variant font-medium">10:45 AM</div>
<button class="bg-error hover:bg-on-error-container text-on-error font-button-text text-button-text px-8 h-touch-target-min rounded-full flex items-center justify-center gap-2 shadow-lg hover:shadow-xl transition-all shadow-error/30">
<span class="material-symbols-outlined font-bold" style="font-variation-settings: 'FILL' 1;">emergency</span>
                    SOS ASSIST
                </button>
<button aria-label="Schedule" class="h-touch-target-min w-touch-target-min flex items-center justify-center rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-[32px]">schedule</span>
</button>
</div>
</div>
<!-- Progress Stepper -->
<div class="bg-surface-container px-margin-edge py-4 border-t border-outline-variant/30 flex items-center gap-4">
<div class="w-full max-w-3xl flex items-center gap-4">
<div class="font-label-lg text-label-lg text-primary font-bold whitespace-nowrap">Step 3 of 5</div>
<div class="flex-grow h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-[60%]"></div>
</div>
<div class="font-body-md text-body-md text-on-surface-variant whitespace-nowrap hidden sm:block">Clinical Assessment (SOCRATES Engine)</div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-margin-edge py-section-gap flex flex-col gap-section-gap overflow-y-auto pb-40">
<!-- Top Zone: Bilingual Audio Question Banner -->
<div class="bg-primary-container text-on-primary-container rounded-3xl p-8 flex flex-col md:flex-row items-center gap-8 shadow-md">
<button aria-label="Play audio question" class="h-[96px] w-[96px] rounded-full bg-surface-container-lowest text-primary flex-shrink-0 flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<div class="flex flex-col gap-2 text-center md:text-left">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-primary-container font-bold">Describe the sensation and where it travels</h1>

</div>
</div>
<!-- Center Zone: 2-Column Split Layout -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-gutter-md">
<!-- Left Column: Single Select -->
<div class="flex flex-col gap-stack-gap">
<div class="flex flex-col mb-2">
<h2 class="font-headline-md text-headline-md text-on-surface font-bold">Character of Pain</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select One</p>
</div>
<div class="grid grid-cols-1 gap-4">
<!-- Option 1 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center gap-6 hover:bg-surface-variant transition-colors text-left">
<div class="h-16 w-16 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-3xl">bolt</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Sharp &amp; Stabbing</span>

</div>
</button>
<!-- Option 2 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center gap-6 hover:bg-surface-variant transition-colors text-left">
<div class="h-16 w-16 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-3xl">sentiment_dissatisfied</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Dull &amp; Aching</span>

</div>
</button>
<!-- Option 3 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center gap-6 hover:bg-surface-variant transition-colors text-left">
<div class="h-16 w-16 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-3xl">local_fire_department</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Burning &amp; Acidic</span>

</div>
</button>
<!-- Option 4 (Active) -->
<button class="h-24 md:h-auto min-h-[96px] bg-primary-container/10 border-4 border-primary rounded-xl p-4 flex items-center gap-6 shadow-sm relative text-left">
<div class="h-16 w-16 rounded-full bg-primary text-on-primary flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">weight</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-label-lg text-label-lg text-primary font-bold">Heavy &amp; Crushing</span>

</div>
<span class="material-symbols-outlined text-primary text-4xl mr-2" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 5 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center gap-6 hover:bg-surface-variant transition-colors text-left">
<div class="h-16 w-16 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-3xl">favorite</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Throbbing</span>

</div>
</button>
</div>
</div>
<!-- Right Column: Multi Select -->
<div class="flex flex-col gap-stack-gap">
<div class="flex flex-col mb-2">
<h2 class="font-headline-md text-headline-md text-on-surface font-bold">Radiation &amp; Associated Symptoms</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select All That Apply</p>
</div>
<div class="grid grid-cols-1 gap-4">
<!-- Option 1 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center justify-between hover:bg-surface-variant transition-colors text-left">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Radiating to Left Arm</span>

</div>
<div class="h-8 w-8 rounded border-2 border-outline flex items-center justify-center"></div>
</button>
<!-- Option 2 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center justify-between hover:bg-surface-variant transition-colors text-left">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Radiating to Jaw &amp; Neck</span>

</div>
<div class="h-8 w-8 rounded border-2 border-outline flex items-center justify-center"></div>
</button>
<!-- Option 3 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center justify-between hover:bg-surface-variant transition-colors text-left">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Shortness of Breath</span>

</div>
<div class="h-8 w-8 rounded border-2 border-outline flex items-center justify-center"></div>
</button>
<!-- Option 4 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center justify-between hover:bg-surface-variant transition-colors text-left">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Cold Sweats &amp; Nausea</span>

</div>
<div class="h-8 w-8 rounded border-2 border-outline flex items-center justify-center"></div>
</button>
<!-- Option 5 -->
<button class="h-24 md:h-auto min-h-[96px] bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center justify-between hover:bg-surface-variant transition-colors text-left">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">None</span>

</div>
<div class="h-8 w-8 rounded border-2 border-outline flex items-center justify-center"></div>
</button>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/30 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] px-margin-edge py-6 z-20">
<div class="max-w-7xl mx-auto flex items-center justify-between">
<!-- Left: Back Button -->
<button class="h-[72px] px-8 border-2 border-primary text-primary font-button-text text-button-text rounded-xl flex items-center justify-center gap-3 hover:bg-primary-container/10 transition-colors bg-surface-container-lowest">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
<div class="flex flex-col items-start leading-tight">
<span class="">Back</span>

</div>
</button>
<!-- Center: Voice Input Area -->
<div class="flex flex-col items-center justify-center gap-2">
<div class="flex items-end h-10 gap-1 bg-surface-container px-6 py-2 rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-primary mr-2 self-center">mic</span>
<div class="waveform-bar w-1.5 h-6 bg-primary rounded-t-sm" style="animation-delay: 0.1s;"></div>
<div class="waveform-bar w-1.5 h-8 bg-primary rounded-t-sm" style="animation-delay: 0.3s;"></div>
<div class="waveform-bar w-1.5 h-4 bg-primary rounded-t-sm" style="animation-delay: 0.5s;"></div>
<div class="waveform-bar w-1.5 h-9 bg-primary rounded-t-sm" style="animation-delay: 0.2s;"></div>
<div class="waveform-bar w-1.5 h-5 bg-primary rounded-t-sm" style="animation-delay: 0.4s;"></div>
</div>
<div class="text-center font-label-lg text-label-lg text-primary flex gap-2">
                    Listening... 
</div>
</div>
<!-- Right: Next Question Button -->
<button class="h-[72px] px-8 bg-primary text-on-primary font-button-text text-button-text rounded-xl flex items-center justify-center gap-3 shadow-md hover:bg-on-primary-fixed-variant transition-colors hover:shadow-lg">
<div class="flex flex-col items-end leading-tight">
<span class="">Next Question</span>

</div>
<span class="material-symbols-outlined text-3xl">arrow_forward</span>
</button>
</div>
</footer>


</body></html>

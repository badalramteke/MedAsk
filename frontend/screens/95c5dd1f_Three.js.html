<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_74 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_74" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_74');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('loading-ring-container');
const width = container.clientWidth || 120;
const height = container.clientHeight || 120;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// MediKiosk Teal color
const tealColor = new THREE.Color(0x0f7a6b);

// Outer rotating ring
const ringGeometry = new THREE.TorusGeometry(5, 0.4, 16, 100);
const ringMaterial = new THREE.MeshPhongMaterial({ 
  color: tealColor, 
  emissive: tealColor,
  emissiveIntensity: 0.5,
  transparent: true, 
  opacity: 0.9 
});
const ring = new THREE.Mesh(ringGeometry, ringMaterial);
scene.add(ring);

// Inner pulsing core
const coreGeometry = new THREE.SphereGeometry(3, 32, 32);
const coreMaterial = new THREE.MeshPhongMaterial({ 
  color: tealColor,
  transparent: true,
  opacity: 0.3
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
scene.add(core);

// Lights
const light = new THREE.PointLight(0xffffff, 1, 100);
light.position.set(10, 10, 10);
scene.add(light);
const ambientLight = new THREE.AmbientLight(0x404040);
scene.add(ambientLight);

camera.position.z = 15;

let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.05;
  
  // Rotation
  ring.rotation.z += 0.05;
  ring.rotation.x += 0.01;
  
  // Pulse
  const scale = 1 + Math.sin(time * 2) * 0.1;
  core.scale.set(scale, scale, scale);
  coreMaterial.opacity = 0.3 + Math.sin(time * 2) * 0.15;
  
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  const newWidth = container.clientWidth || 120;
  const newHeight = container.clientHeight || 120;
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_74 -->
</body>
</html>

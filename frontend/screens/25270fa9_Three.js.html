<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_78 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_78" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_78');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
    const scene = new THREE.Scene();
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || window.innerHeight;
    const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const icons = [];
    const iconCount = 15;
    const tealColor = new THREE.Color(0x0f7a6b);

    // Create simple medical cross geometries
    for (let i = 0; i < iconCount; i++) {
        const group = new THREE.Group();
        
        const mat = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            transparent: true, 
            opacity: 0.15 
        });

        const horizGeo = new THREE.BoxGeometry(2, 0.6, 0.2);
        const vertGeo = new THREE.BoxGeometry(0.6, 2, 0.2);
        
        group.add(new THREE.Mesh(horizGeo, mat));
        group.add(new THREE.Mesh(vertGeo, mat));

        group.position.set(
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 25,
            (Math.random() - 5) * 10
        );
        
        group.userData = {
            velocity: new THREE.Vector3(
                (Math.random() - 0.5) * 0.02,
                (Math.random() - 0.5) * 0.02,
                0
            ),
            rotationSpeed: (Math.random() - 0.5) * 0.01
        };

        scene.add(group);
        icons.push(group);
    }

    camera.position.z = 20;

    function animate() {
        requestAnimationFrame(animate);
        
        icons.forEach(icon => {
            icon.position.add(icon.userData.velocity);
            icon.rotation.z += icon.userData.rotationSpeed;
            icon.rotation.y += icon.userData.rotationSpeed * 0.5;

            // Wrap around edges
            if (Math.abs(icon.position.x) > 25) icon.position.x *= -0.95;
            if (Math.abs(icon.position.y) > 15) icon.position.y *= -0.95;
        });

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_78 -->
</body>
</html>

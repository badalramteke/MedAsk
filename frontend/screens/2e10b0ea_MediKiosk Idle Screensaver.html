<div class="absolute inset-0 w-full h-full z-0 opacity-80" style="display:block;">
<canvas id="shader-canvas-ANIMATION_77" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_77');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    
    // Create a slow, subtle flowing gradient between MediKiosk teals
    vec3 color1 = vec3(0.0588, 0.4784, 0.4196); // #0f7a6b
    vec3 color2 = vec3(0.0392, 0.3137, 0.2745); // Darker teal
    
    float noise = sin(uv.x * 2.0 + u_time * 0.2) * cos(uv.y * 2.0 + u_time * 0.3);
    vec3 finalColor = mix(color1, color2, noise * 0.5 + 0.5);
    
    // Add a slight vignette for depth
    float dist = distance(uv, vec2(0.5));
    finalColor *= 1.0 - dist * 0.3;
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div class="absolute inset-0 w-full h-full z-10 pointer-events-none" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_78" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_78');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
    const scene = new THREE.Scene();
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || window.innerHeight;
    const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const icons = [];
    const iconCount = 15;
    const tealColor = new THREE.Color(0x0f7a6b);

    // Create simple medical cross geometries
    for (let i = 0; i < iconCount; i++) {
        const group = new THREE.Group();
        
        const mat = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            transparent: true, 
            opacity: 0.15 
        });

        const horizGeo = new THREE.BoxGeometry(2, 0.6, 0.2);
        const vertGeo = new THREE.BoxGeometry(0.6, 2, 0.2);
        
        group.add(new THREE.Mesh(horizGeo, mat));
        group.add(new THREE.Mesh(vertGeo, mat));

        group.position.set(
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 25,
            (Math.random() - 5) * 10
        );
        
        group.userData = {
            velocity: new THREE.Vector3(
                (Math.random() - 0.5) * 0.02,
                (Math.random() - 0.5) * 0.02,
                0
            ),
            rotationSpeed: (Math.random() - 0.5) * 0.01
        };

        scene.add(group);
        icons.push(group);
    }

    camera.position.z = 20;

    function animate() {
        requestAnimationFrame(animate);
        
        icons.forEach(icon => {
            icon.position.add(icon.userData.velocity);
            icon.rotation.z += icon.userData.rotationSpeed;
            icon.rotation.y += icon.userData.rotationSpeed * 0.5;

            // Wrap around edges
            if (Math.abs(icon.position.x) > 25) icon.position.x *= -0.95;
            if (Math.abs(icon.position.y) > 15) icon.position.y *= -0.95;
        });

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });
})();
})();
</script>

<script>
        // Digital Clock Logic
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            document.getElementById('digital-clock').textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Language Cycler Logic
        const languages = ['English', 'हिंदी (Hindi)', 'मराठी (Marathi)', 'தமிழ் (Tamil)', 'తెలుగు (Telugu)'];
        let currentLangIndex = 0;
        const langElement = document.getElementById('language-cycler');

        setInterval(() => {
            langElement.style.opacity = 0;
            setTimeout(() => {
                currentLangIndex = (currentLangIndex + 1) % languages.length;
                langElement.textContent = languages[currentLangIndex];
                langElement.style.opacity = 0.8;
            }, 1000);
        }, 4000);

        // Click to proceed (Simulated)
        document.body.addEventListener('click', () => {
            // In a real app, this would route to the main menu
            document.body.style.opacity = 0;
            document.body.style.transition = 'opacity 0.5s ease-out';
            setTimeout(() => {
                document.body.style.opacity = 1;
                // window.location.href = '/home'; // simulated action
            }, 500);
        });
    </script>

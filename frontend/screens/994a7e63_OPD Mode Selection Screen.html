<div class="absolute inset-0 bg-gradient-to-br from-surface via-surface to-primary-fixed/20 pointer-events-none opacity-50"></div>
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary-fixed-dim/10 blur-[120px] pointer-events-none"></div>

<div class="absolute top-0 right-0 p-8 opacity-0 peer-checked:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-4xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="w-24 h-24 rounded-2xl bg-primary-fixed/30 flex items-center justify-center mb-8 peer-checked:bg-on-primary/20 transition-colors">
<span class="material-symbols-outlined text-[56px] text-primary peer-checked:text-on-primary-container">stethoscope</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2 peer-checked:text-on-primary">
            General OPD
          </h2>
<div class="font-headline-md text-headline-md text-primary mb-6 peer-checked:text-on-primary-container/90">
            (Allopathic)
          </div>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-auto peer-checked:text-on-primary/80">

</label>

<div class="absolute top-0 right-0 p-8 opacity-0 peer-checked:opacity-100 transition-opacity duration-300">

            (AYUSH)

<p class="font-body-lg text-body-lg text-on-surface-variant mt-auto peer-checked:text-on-primary/80">
            Dashavidha Pariksha, Prakriti, Vikriti, Agni, Koshtha holistic assessment.
          </p>

</label>
</div>
<div class="flex flex-col items-center justify-center space-y-10 mt-auto pb-12">
<div class="inline-flex items-center gap-3 px-6 py-3 rounded-full bg-primary-fixed/20 text-on-surface font-label-lg text-label-lg shadow-sm">
<span class="material-symbols-outlined text-primary text-2xl">info</span>
<span class="">Selected mode configures your question sequence</span>
</div>
<button class="w-full max-w-md h-[90px] rounded-[24px] bg-primary text-on-primary font-display-lg-mobile text-display-lg-mobile flex items-center justify-center gap-4 shadow-xl shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all duration-300 group disabled:opacity-50 disabled:pointer-events-none" disabled="" id="nextBtn" onclick="const selected = document.querySelector('input[name=&quot;opd_type&quot;]:checked'); if(!selected) return; const isGeneral = selected.value === 'general'; const msg = isGeneral ? 'General OPD selected. Loading SOCRATES Symptom Engine (Step 6A)...' : 'Ayurvedic OPD selected. Loading AYUSH Clinical Assessment (Step 6B)...'; const toast = document.getElementById('kiosk-notification-toast'); const toastText = document.getElementById('kiosk-toast-text'); if(toast &amp;&amp; toastText){ toastText.innerText = msg; toast.classList.remove('opacity-0', 'pointer-events-none'); toast.classList.add('opacity-100'); setTimeout(() =&gt; { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0', 'pointer-events-none'); }, 3000); }">
<span class="">Next</span>
<span class="material-symbols-outlined text-4xl group-hover:translate-x-2 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const radioInputs = document.querySelectorAll('input[name="opd_type"]');
    const nextBtn = document.getElementById('nextBtn');

    radioInputs.forEach(input => {
      input.addEventListener('change', () => {
        if(document.querySelector('input[name="opd_type"]:checked')) {
            nextBtn.removeAttribute('disabled');
        }
      });
    });
  });
</script><div id="kiosk-notification-toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-3 px-6 py-4 rounded-2xl bg-on-surface text-surface shadow-xl text-button-text font-button-text"><span class="material-symbols-outlined text-primary-fixed">check_circle</span><span id="kiosk-toast-text"></span></div></main>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_54 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_54" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_54');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const container = document.getElementById('staff-arrival-timer');
const width = container.clientWidth || 400;
const height = container.clientHeight || 400;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create a pulsing ring
const ringGeometry = new THREE.TorusGeometry(5, 0.2, 16, 100);
const ringMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
const ring = new THREE.Mesh(ringGeometry, ringMaterial);
scene.add(ring);

// Inner core warning exclamation mark (simplified as a cylinder and sphere)
const stemGeometry = new THREE.CylinderGeometry(0.5, 0.5, 4, 32);
const exclamationStem = new THREE.Mesh(stemGeometry, ringMaterial);
exclamationStem.position.y = 1;
scene.add(exclamationStem);

const dotGeometry = new THREE.SphereGeometry(0.6, 32, 32);
const exclamationDot = new THREE.Mesh(dotGeometry, ringMaterial);
exclamationDot.position.y = -2.5;
scene.add(exclamationDot);

camera.position.z = 15;

let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.05;
  
  // Pulse effect
  const scale = 1 + Math.sin(time * 2) * 0.1;
  ring.scale.set(scale, scale, scale);
  ring.rotation.z += 0.01;
  
  // Fade effect
  ringMaterial.opacity = 0.5 + Math.sin(time * 2) * 0.3;
  
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  const newWidth = container.clientWidth || window.innerWidth;
  const newHeight = container.clientHeight || window.innerHeight;
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_54 -->
</body>
</html>

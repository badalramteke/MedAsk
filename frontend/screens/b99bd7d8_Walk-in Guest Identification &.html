<style>

        /* Custom input focus ring to match primary color */
        input:focus { border-color: #005f53 !important; ring-color: #005f53 !important; }

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-edge h-[88px] bg-surface border-b border-outline-variant shadow-sm shrink-0">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<div class="font-headline-lg text-headline-lg text-primary tracking-tight">MediKiosk</div>
</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-2 text-on-surface-variant font-headline-md text-headline-md mr-4">
<span class="material-symbols-outlined">schedule</span>
<span id="current-time">10:45 AM</span>
</div>
<button class="h-touch-target-min px-6 rounded-full bg-error text-on-error font-button-text text-button-text flex items-center gap-2 shadow-sm hover:bg-tertiary transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emergency</span>
                SOS ASSIST
            </button>
</div>
</header>
<!-- Main Workspace (Padding top for fixed header) -->
<main class="flex-1 mt-[88px] flex flex-col p-margin-edge gap-section-gap h-[calc(100vh-88px)] overflow-y-auto">
<!-- Navigation Header -->
<div class="flex items-center gap-6">
<button class="w-16 h-16 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-outline-variant transition-colors active:scale-95 shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-[32px]">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-display-lg text-display-lg text-on-surface">Identify Yourself</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Step 2 of 4</p>
</div>
</div>
<!-- Authentication Tabs -->
<div class="flex bg-surface-container-low rounded-2xl p-2 shadow-sm border border-outline-variant">
<button class="flex-1 h-touch-target-min rounded-xl font-button-text text-button-text text-on-surface-variant hover:bg-surface-variant transition-colors flex flex-col items-center justify-center">
<span class="text-[18px]">ABHA Number</span>
</button>
<button class="flex-1 h-touch-target-min rounded-xl font-button-text text-button-text text-on-surface-variant hover:bg-surface-variant transition-colors flex flex-col items-center justify-center">
<span class="text-[18px]">Scan QR Code</span>
</button>
<button class="flex-1 h-touch-target-min rounded-xl font-button-text text-button-text text-on-surface-variant hover:bg-surface-variant transition-colors flex flex-col items-center justify-center">
<span class="text-[18px]">Aadhaar OTP</span>
</button>
<!-- ACTIVE TAB -->
<button class="flex-1 h-touch-target-min rounded-xl font-button-text text-button-text bg-primary text-on-primary shadow-md flex flex-col items-center justify-center active:scale-95 transition-transform duration-100">
<span class="text-[18px]">Walk-in Guest</span>
</button>
</div>
<!-- Main Content Area -->
<div class="flex flex-1 gap-margin-edge">
<!-- Left Column: Form (Bento Grid Style) -->
<div class="w-2/3 flex flex-col gap-stack-gap">
<!-- Full Name & Age Row -->
<div class="grid grid-cols-3 gap-stack-gap">
<!-- Full Name -->
<div class="col-span-2 bg-surface rounded-2xl p-gutter-md shadow-sm border border-outline-variant flex flex-col gap-2 relative">
<label class="font-label-lg text-label-lg text-on-surface-variant">Full Name</label>
<div class="relative">
<input class="w-full h-touch-target-min bg-surface-container-lowest border-2 border-outline-variant rounded-xl px-4 font-headline-md text-headline-md text-on-surface focus:ring-0 focus:border-primary transition-colors" placeholder="Tap to type..." type="text"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors bg-surface rounded-lg">
<span class="material-symbols-outlined text-[32px]">keyboard</span>
</button>
</div>
</div>
<!-- Age Stepper -->
<div class="col-span-1 bg-surface rounded-2xl p-gutter-md shadow-sm border border-outline-variant flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface-variant">Age</label>
<div class="flex items-center justify-between h-touch-target-min bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-2">

<button class="w-12 h-12 rounded-lg bg-surface-container-highest text-on-surface flex items-center justify-center hover:bg-outline-variant transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>
</div>
</div>
</div>
<!-- Gender Selection -->

<div class="grid grid-cols-3 gap-stack-gap">
<!-- Male Selected -->

</div>
</div>

<div class="bg-secondary-container/30 border border-secondary-fixed rounded-2xl p-4 flex items-start gap-4 mt-auto">

</div>
<!-- Right Column: Mobile Number & Numpad & Actions -->

<!-- Numbers 1-9 -->

<button class="h-16 bg-surface-container-highest rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-outline-variant transition-colors active:scale-95 shadow-sm">4</button>
<button class="h-16 bg-surface-container-highest rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-outline-variant transition-colors active:scale-95 shadow-sm">5</button>

<button class="h-16 bg-surface-container-highest rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-outline-variant transition-colors active:scale-95 shadow-sm">9</button>
<!-- Clear -->
<button class="h-16 bg-surface-variant rounded-xl font-headline-md text-headline-md text-error hover:bg-error-container transition-colors active:scale-95 shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined">backspace</span>
</button>
<!-- 0 -->
<button class="h-16 bg-surface-container-highest rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-outline-variant transition-colors active:scale-95 shadow-sm">0</button>
<!-- Done/Next -->
<button class="h-16 bg-surface-variant rounded-xl font-headline-md text-headline-md text-primary hover:bg-primary-container transition-colors active:scale-95 shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined">done</span>
</button>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 mt-auto">
<button class="w-full h-[72px] bg-primary text-on-primary rounded-xl font-button-text text-button-text shadow-md hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-[0.98] flex items-center justify-center gap-3">
<span>Continue as Walk-in Guest</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full h-touch-target-min border-2 border-primary text-primary rounded-xl font-button-text text-button-text hover:bg-primary/5 transition-colors active:scale-[0.98]">
                        Search Existing Hospital Record
                    </button>
</div>
</div>
</div>
</main>
<script>
        // Simple script to keep time updated (optional micro-interaction)
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            const strTime = hours + ':' + minutes + ' ' + ampm;
            document.getElementById('current-time').innerText = strTime;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

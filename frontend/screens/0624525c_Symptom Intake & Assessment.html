<input class="w-full h-4 appearance-none bg-transparent relative z-10 cursor-pointer [&amp;::-webkit-slider-thumb]:appearance-none [&amp;::-webkit-slider-thumb]:w-12 [&amp;::-webkit-slider-thumb]:h-12 [&amp;::-webkit-slider-thumb]:rounded-full [&amp;::-webkit-slider-thumb]:bg-surface-container-lowest [&amp;::-webkit-slider-thumb]:shadow-md [&amp;::-webkit-slider-thumb]:border-4 [&amp;::-webkit-slider-thumb]:border-primary" id="pain-slider" max="10" min="1" type="range" value="5"/>

<script>
        // Pain Slider Logic
        const slider = document.getElementById('pain-slider');
        const track = document.getElementById('pain-track');
        const emoji = document.getElementById('pain-emoji');
        
        const emojis = ['😊', '🙂', '😐', '😕', '😟', '😣', '😖', '😫', '😩', '😭'];

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            const percent = ((val - 1) / 9) * 100;
            track.style.width = `${percent}%`;
            
            emoji.textContent = emojis[val - 1];
            emoji.style.transform = `scale(${1 + (val * 0.05)})`;
            
            // Adjust track color gradient based on value
            if(val <= 3) {
                track.className = "absolute top-1/2 left-0 h-4 -mt-2 rounded-full bg-secondary-fixed transition-colors";
            } else if (val <= 7) {
                track.className = "absolute top-1/2 left-0 h-4 -mt-2 rounded-full bg-gradient-to-r from-secondary-fixed to-primary-container transition-colors";
            } else {
                track.className = "absolute top-1/2 left-0 h-4 -mt-2 rounded-full bg-gradient-to-r from-primary-container to-error transition-colors";
            }
        });

        // Body Map Interaction
        const bodyParts = document.querySelectorAll('svg [data-area]');
        const selectionBox = document.getElementById('body-selection');
        const selectionText = document.getElementById('body-selection-text');

        bodyParts.forEach(part => {
            part.addEventListener('click', function() {
                // Reset all
                bodyParts.forEach(p => p.classList.remove('fill-primary-fixed', 'stroke-primary'));
                
                // Set active
                this.classList.add('fill-primary-fixed', 'stroke-primary');
                
                // Show label
                selectionText.textContent = this.getAttribute('data-area');
                selectionBox.classList.remove('hidden');
                
                // Trigger reflow for animation
                void selectionBox.offsetWidth;
                selectionBox.classList.remove('opacity-0');
            });
        });

        // Mic Button Interaction (Simulated)
        const micBtn = document.getElementById('mic-btn');
        let isRecording = false;
        micBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            const icon = micBtn.querySelector('.material-symbols-outlined');
            const bg = micBtn.querySelector('.bg-primary, .bg-error');
            
            if(isRecording) {
                icon.textContent = 'stop_circle';
                bg.classList.replace('bg-primary', 'bg-error');
                bg.classList.add('animate-pulse');
            } else {
                icon.textContent = 'mic';
                bg.classList.replace('bg-error', 'bg-primary');
                bg.classList.remove('animate-pulse');
            }
        });
    </script>

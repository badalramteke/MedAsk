version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: medikiosk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Supabase local development stack would typically be orchestrated via the Supabase CLI
  # For local testing without the CLI, a basic Postgres instance is provided
  db:
    image: postgres:15-alpine
    container_name: medikiosk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_local
      POSTGRES_DB: medikiosk
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  db_data:
